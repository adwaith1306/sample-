<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple YouTube Page</title>
  <link rel="stylesheet" href="youtube.css" />
</head>
<body>
  <header class="header">
    <div class="logo">YouTube</div>
    <div class="search-bar">
      <input type="text" placeholder="Search" />
      <button>🔍</button>
    </div>
  </header>

  <div class="container">
    <nav class="sidebar">
      <ul>
        <li class="active">Home</li>
        <li>Trending</li>
        <li>Subscriptions</li>
        <li>Library</li>
        <li>History</li>
      </ul>
    </nav>

    <main class="content">
      <h2>Recommended Videos</h2>
      <div class="videos">
        <div class="video-card">
          <div class="thumbnail"></div>
          <div class="video-info">
            <h3>Sample Video Title 1</h3>
            <p>Channel Name • 1M views • 2 days ago</p>
          </div>
        </div>
        <div class="video-card">
          <div class="thumbnail"></div>
          <div class="video-info">
            <h3>Sample Video Title 2</h3>
            <p>Channel Name • 500K views • 1 week ago</p>
          </div>
        </div>
        <div class="video-card">
          <div class="thumbnail"></div>
          <div class="video-info">
            <h3>Sample Video Title 3</h3>
            <p>Channel Name • 2.5M views • 3 months ago</p>
          </div>
        </div>
        <!-- Add more video cards as needed -->
      </div>
    </main>
  </div>
</body>
</html>
